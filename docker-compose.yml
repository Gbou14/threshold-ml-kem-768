# ── Threshold ML-KEM-768 decapsulation — 3-of-5 multi-container demo ────────
#
# Real, full CCA-secure ML-KEM-768 (the Fujisaki-Okamoto-wrapped KEM,
# src/kyber/kem.c) with a Shamir-shared secret key, not the bare IND-CPA
# PKE. See src/kyber/README.md's "Phase 5" section for the one explicit,
# narrower trust assumption this makes (the coordinator briefly sees the
# decrypted message while finishing the FO check) versus full
# generic-MPC threshold cryptography.
#
# Startup order:
#   1. sh1..sh5 start (shareholder HTTP servers)
#   2. dealer       generates a real ML-KEM-768 KEM keypair (ek, dk),
#                   Shamir-shares dk's PKE component -- 768 NTT-domain
#                   coefficients over Z_3329 -- sends one share to each
#                   sh*, and writes ek to ./data/ek.bin and z (the
#                   implicit-rejection value) to ./data/z.bin for the
#                   coordinator to pick up
#   3. coordinator  runs 200 trials of: real ML-KEM-768 Encaps with ek ->
#                   collect k partial decryptions over HTTP ->
#                   threshold_decaps (Lagrange-combine + finish the FO
#                   check) -> AES-256-GCM round trip keyed directly from
#                   the KEM's shared secret. Writes results to
#                   ./data/results.csv
#
# No party, including the dealer after it exits, ever holds dk (the
# private key) again -- only individual shares exist from that point on.
# The coordinator does hold ek and z, which is expected: z isn't part of
# the private key, it's needed for Decaps by whichever party finishes
# it, threshold or not.
#
# Running it:
#   docker compose up -d && docker wait coordinator && docker compose logs coordinator
#   cat data/results.csv
#   docker compose down
#
# Don't use `docker compose up --abort-on-container-exit` here: dealer is a
# one-shot job that's *expected* to exit, and --abort-on-container-exit tears
# down the whole stack (including the shareholders) the moment ANY container
# exits, regardless of which one -- it'll kill the shareholders out from under
# the coordinator before it can finish. `docker wait <service>` waits for one
# specific container instead.
#
# Experiments:
#   # Use a different 3-party subset:
#   docker compose run --rm -e USE_HOSTS=sh1,sh3,sh5 coordinator
#
#   # Test below threshold (will refuse to run, or reconstruct garbage if you
#   # also bypass the host-count check):
#   docker compose run --rm -e USE_HOSTS=sh1,sh2 -e THRESHOLD=3 coordinator
#
#   # Change trial count:
#   docker compose run --rm -e N_TRIALS=500 coordinator
#
# Note: `docker compose run coordinator` re-checks the dealer's
# service_completed_successfully condition and may re-run the dealer first
# (generating a fresh keypair and re-distributing shares to all 5
# shareholders) even though you only asked to re-run the coordinator.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  shamir-net:
    driver: bridge

volumes:
  results:        # shared between coordinator and host for CSV output

x-sh-base: &sh-base
  build: .
  networks: [shamir-net]
  command: ["./shareholder", "8080"]
  expose: ["8080"]
  restart: "no"

services:

  # ── Share-holders ─────────────────────────────────────────────────────────
  sh1:
    <<: *sh-base
    container_name: sh1
    hostname: sh1

  sh2:
    <<: *sh-base
    container_name: sh2
    hostname: sh2

  sh3:
    <<: *sh-base
    container_name: sh3
    hostname: sh3

  sh4:
    <<: *sh-base
    container_name: sh4
    hostname: sh4

  sh5:
    <<: *sh-base
    container_name: sh5
    hostname: sh5

  # ── Dealer ────────────────────────────────────────────────────────────────
  dealer:
    build: .
    container_name: dealer
    hostname: dealer
    networks: [shamir-net]
    command: ["./dealer"]
    environment:
      SHAREHOLDER_HOSTS: "sh1,sh2,sh3,sh4,sh5"
      SHAREHOLDER_PORT:  "8080"
      EK_PATH:           "/data/ek.bin"
      Z_PATH:            "/data/z.bin"
    volumes:
      - ./data:/data                # ek.bin, z.bin appear here for the coordinator
    depends_on: [sh1, sh2, sh3, sh4, sh5]
    restart: "no"

  # ── Coordinator ───────────────────────────────────────────────────────────
  coordinator:
    build: .
    container_name: coordinator
    hostname: coordinator
    networks: [shamir-net]
    command: ["./coordinator"]
    environment:
      THRESHOLD:         "3"
      SHAREHOLDER_HOSTS: "sh1,sh2,sh3,sh4,sh5"
      SHAREHOLDER_PORT:  "8080"
      N_TRIALS:          "200"
      OUTPUT_FILE:       "/data/results.csv"
      EK_PATH:           "/data/ek.bin"
      Z_PATH:            "/data/z.bin"
      # USE_HOSTS: "sh1,sh3,sh5"   # uncomment to pick a specific subset
    volumes:
      - ./data:/data                # results.csv appears in ./data/ on host
    depends_on:
      dealer:
        condition: service_completed_successfully
    restart: "no"
